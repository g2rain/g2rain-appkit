name: Publish npm packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing / modern publish path requires npm >= 11.5.1.
      # Do not assume the Node image's bundled npm meets that floor.
      - name: Use current npm
        run: npm install --global npm@^11.5.1

      - name: Assert release tag matches workspace versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch> format, got: $RELEASE_TAG"
            exit 1
          fi
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          for package in theme ui http platform; do
            ACTUAL_VERSION=$(node -p "require('./packages/$package/package.json').version")
            if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "@g2rain/$package is $ACTUAL_VERSION, expected $EXPECTED_VERSION from $RELEASE_TAG"
              exit 1
            fi
          done

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run pack:check

      # Bootstrap: Environment secret NPM_PUBLISH_TOKEN on `npm` (manual approval).
      # Do NOT store this as a repository secret. After Trusted Publisher is set up
      # for each @g2rain/* package, remove NPM_PUBLISH_TOKEN and switch to
      # OIDC-only publish with --provenance (no NODE_AUTH_TOKEN).
      - name: Publish packages (bootstrap Environment token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --workspace @g2rain/theme --access public
          npm publish --workspace @g2rain/ui --access public
          npm publish --workspace @g2rain/http --access public
          npm publish --workspace @g2rain/platform --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "G2rain Appkit $RELEASE_TAG" \
            --generate-notes
