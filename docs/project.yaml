validation:
  status: main-sub-pilot-validated
  reviewedAt: "2026-10-01"
  readiness:
    libraryPhaseOne: passed
    memberAppPilot: passed
    pilotIntegration: passed
    themeUiPilot: passed-by-user-confirmation
    httpPilot: passed
    platformSubPilot: passed
    mainShellPlatformMainIntegration: passed
    registryRelease: not-ready
    platformClosedLoop: incomplete
  note: >
    Theme、UI、HTTP 首版实现与 Playground 已通过类型检查、测试、构建、制品检查和 npm pack dry-run。
    g2rain-member-app 已安装 Theme、UI、HTTP、Platform 本地制品，并以 @g2rain/platform/sub 的
    createStandardSubPlatform 统一独立模式与 qiankun 子应用生命周期。
    Theme/UI 按用户 2026-09-17 确认记录为试点通过；HTTP 已于 2026-09-18 经用户确认验证通过，
    member-app 的本地 components/http 已移除，应用装配迁至 runtime/http。
    2026-10-01 用户确认 g2rain-member-app 与 g2rain-admin-shell 使用 kits 本地制品完成联调，
    覆盖独立模式、qiankun 生命周期、多实例隔离与主题协作；两端生产构建均已通过。Admin Shell
    已接入 @g2rain/platform/main 与 @g2rain/http，Member 已接入 @g2rain/platform/sub 与 @g2rain/http。
    Registry 发布仍需确认 @g2rain scope 权限、以确定提交重新打包候选制品、跑通 GitHub Actions 与发布审批；
    模板/CLI 默认接入和其他 App 推广尚未完成，因此平台闭环保持 incomplete，当前不发布任何 npm 包。
