schemaVersion: 1

name: g2rain-appkit
family: platform-shared-library
role: G2rain 前端公共契约与基础能力库
repository: g2rain/g2rain-appkit
implementationType: frontend-shared-packages
platformRole: supporting-library
implementationPolicy: organization-singleton

architectureRegistration:
  repository: https://github.com/g2rain/g2rain
  ref: feature/g2rain-architectur-init
  centralDocument: docs/architecture/platform-libraries/g2rain-appkit.md
  profile: null
  status: registered
  note: 中央架构发布包含本登记的新 architecture-v* 快照后，将 ref 切换为固定 Tag

peerLibraries:
  - g2rain/g2rain-common
  - g2rain/g2rain-spring-boot-starter

relatedProfiles:
  - id: frontend-app
    version: 1.0.0
  - id: frontend-shell
    version: 1.0.0

packages:
  - "@g2rain/theme"
  - "@g2rain/ui"
  - "@g2rain/http"
  - "@g2rain/platform"

documentation:
  entry: docs/README.md
  architecture: docs/architecture/overview.md
  platformFramework: docs/architecture/platform-framework.md
  platformHandbook: docs/development/platform-handbook.md
  packageBoundaries: docs/packages/README.md
  componentBaseline: docs/packages/component-migration-baseline.md
  platformDataComponents: docs/packages/platform-data-components.md
  runtimeContracts: docs/packages/http-runtime-contract.md
  development: docs/development/repository-conventions.md
  buildAndTest: docs/development/build-and-test-contract.md
  integrationReadiness: docs/development/integration-readiness.md
  release: docs/release/publishing.md
  migration: docs/migration/application-migration.md
  changelog: CHANGELOG.md

validation:
  status: pilot-integration-in-progress
  reviewedAt: "2026-09-19"
  readiness:
    libraryPhaseOne: passed
    pilotIntegration: in-progress
    themeUiPilot: closed-by-user-confirmation
    httpPilot: passed
    registryRelease: not-ready
    platformClosedLoop: incomplete
  note: >
    Theme、UI、HTTP 首版实现与 Playground 已通过类型检查、测试、构建、制品检查和 npm pack dry-run。
    g2rain-member-app 已安装 Theme、UI、HTTP 本地制品；Platform 的真实接入与 Main Shell 联调仍在验证。
    Theme/UI 按用户 2026-09-17 确认记录为试点闭环，不代表全部联调测试已通过。
    HTTP 已于 2026-09-18 经用户确认验证通过，member-app 的本地 components/http 已移除，应用装配迁至 runtime/http。
    2026-09-19 起 appkit 内运行时包名为 @g2rain/platform：包根契约、/sub Kernel、双壳入口解析、/main 协调端口和标准 Capability 已落地，壳与 Member 尚未接入，平台闭环未完成。
    Member 的独立运行、qiankun 集成和 Platform Main/Sub 协作必须整体通过后，才会发布任何 npm 包。
