validation:
  status: member-app-pilot-basically-passed
  reviewedAt: "2026-09-20"
  readiness:
    libraryPhaseOne: passed
    memberAppPilot: basically-passed
    pilotIntegration: basically-passed
    themeUiPilot: passed-by-user-confirmation
    httpPilot: passed
    platformSubPilot: passed-by-user-confirmation
    mainShellPlatformMainIntegration: pending
    registryRelease: not-ready
    platformClosedLoop: incomplete
  note: >
    Theme、UI、HTTP 首版实现与 Playground 已通过类型检查、测试、构建、制品检查和 npm pack dry-run。
    g2rain-member-app 已安装 Theme、UI、HTTP、Platform 本地制品，并以 @g2rain/platform/sub 的
    createStandardSubPlatform 统一独立模式与 qiankun 子应用生命周期。
    Theme/UI 按用户 2026-09-17 确认记录为试点通过；HTTP 已于 2026-09-18 经用户确认验证通过，
    member-app 的本地 components/http 已移除，应用装配迁至 runtime/http。
    2026-09-20 用户确认 Appkit 在 member-app 上已基本验证成功；该结论用于确认真实 App 的 Sub
    接入方向，不替代逐项测试记录，也不表示 Main Shell 已接入 @g2rain/platform/main。
    Registry 发布、Main Shell 的 /main 端口接线、跨主子应用联合验收、模板/CLI 默认接入和其他 App
    推广仍未完成，因此平台闭环保持 incomplete，当前不发布任何 npm 包。
